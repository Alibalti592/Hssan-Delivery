# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Mirrors the 'lax' fallback in packages/lexik_jwt_authentication.php.
    env(JWT_COOKIE_SAMESITE): 'lax'
    # Who may tell the app the client's real address (see trusted_proxies in
    # packages/framework.yaml). Railway's edge by default; a self-hosted
    # server behind Caddy in Docker sets '127.0.0.1,PRIVATE_SUBNETS'.
    env(TRUSTED_PROXIES): '127.0.0.1,100.64.0.0/10'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            # PushNotificationService::__construct — see its docblock for
            # why this is a plain string rather than a packages/*.yaml entry.
            string $firebaseCredentials: '%env(FIREBASE_CREDENTIALS)%'
            # AuthController::logout() — must match set_cookies.BEARER.secure
            # in lexik_jwt_authentication.yaml, or the browser won't recognize
            # the clearing cookie as overriding the one login set.
            bool $jwtCookieSecure: '%env(bool:JWT_COOKIE_SECURE)%'
            # Same for SameSite: production sets BEARER with SameSite=None
            # (admin and API on different sites), and browsers drop a
            # SameSite=Lax Set-Cookie on a cross-site response -- so a
            # hardcoded 'lax' here meant logout never cleared the cookie.
            string $jwtCookieSameSite: '%env(JWT_COOKIE_SAMESITE)%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Photos clients take of their bills (Factures orders) show their name,
    # address and account numbers, so unlike the catalogue photos they're
    # stored outside public/ (on the same persistent volume) and only served
    # through OrderController::billPhoto, which checks who is asking.
    app.private_photo_uploader:
        class: App\Service\PhotoUploader
        arguments:
            $uploadsDir: '%kernel.project_dir%/var/storage/private'
