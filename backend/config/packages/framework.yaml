# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    # A reverse proxy forwards every request (Railway's edge on its private
    # 100.64.0.0/10 network, or Caddy on a self-hosted server), so without
    # this getClientIp() is the proxy's address, shared by everyone, and the
    # per-IP limits (sign-up, login throttling) would count all clients
    # together. Trust what it forwards — the client address and https — but
    # never a forwarded host. Set per host with TRUSTED_PROXIES (default in
    # services.yaml).
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-port']

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
