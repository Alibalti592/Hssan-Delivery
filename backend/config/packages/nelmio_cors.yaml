nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'POST', 'PUT', 'PATCH', 'DELETE']
        allow_headers: ['Content-Type', 'Authorization', 'X-Client-Platform']
        allow_credentials: false
        max_age: 3600
    paths:
        '^/api':
            allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
            allow_methods: ['GET', 'POST', 'PUT', 'PATCH', 'DELETE']
            # X-Client-Platform: the admin dashboard sends this on every
            # request; WebLoginResponseSanitizer reads it on login to strip
            # the JWT from the response body for browser clients (see that
            # class for why — the httpOnly cookie already covers them).
            allow_headers: ['Content-Type', 'Authorization', 'X-Client-Platform']
            # Required so the browser sends/stores the admin dashboard's
            # httpOnly JWT cookie cross-origin (see lexik_jwt_authentication.yaml).
            # Safe only because CORS_ALLOW_ORIGIN is a specific origin allowlist,
            # never a wildcard — browsers refuse credentials on a "*" origin anyway.
            allow_credentials: true
            max_age: 3600
