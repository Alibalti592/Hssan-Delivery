name: mobile
description: "Hssan Delivery courier application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  http: ^1.2.2
  provider: ^6.1.2
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.1
  intl: ^0.20.3
  sentry_flutter: ^9.30.0
  firebase_core: ^4.14.0
  firebase_messaging: ^16.7.0
  geolocator: ^14.0.3
  # A regular dependency, not just the dev-time generator: main.dart uses
  # it to hold the native launch screen until the splash image is ready.
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # The native launch image, also drawn by SplashScreen so the two match.
  assets:
    - assets/icon/splash_logo.png

  # Bundled so the app renders text without a network fetch to Google Fonts —
  # on web, Flutter's CanvasKit renderer otherwise fetches Roboto from
  # fonts.gstatic.com at startup and silently renders blank text if that
  # fails (no connectivity, corporate proxy, offline courier in the field).
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-ExtraBold.ttf
          weight: 800

# Native launcher icon, regenerated with `dart run flutter_launcher_icons`.
# Android gets an adaptive icon (black background + chrome "DH" script
# monogram foreground, echoing the client's logo); everything else gets the
# flat black/monogram square. Source art:
# assets/icon/app_icon.png (1024x1024, no transparency) and
# assets/icon/app_icon_foreground.png (transparent, glyph inside the safe zone).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true

# Native splash screen, regenerated with `dart run flutter_native_splash:create`.
# Black background with the chrome "DH" script monogram centered. The image
# is the glyph from assets/icon/app_icon_foreground.png, 140dp wide at 4x, in
# a 1152x1152 transparent square -- the size Android 12+ expects for a
# splash icon without an icon background (it shows it at 288dp, content
# inside the central 192dp circle) and the 4x flutter_native_splash assumes
# elsewhere. SplashScreen draws the same file in the same box, so the logo
# doesn't move on the hand-off (update SplashMonogram.glyphHeight if the
# glyph changes). No separate dark-mode assets: the brand background is
# already black.
flutter_native_splash:
  color: "#000000"
  image: assets/icon/splash_logo.png
  color_dark: "#000000"
  image_dark: assets/icon/splash_logo.png
  android_12:
    image: assets/icon/splash_logo.png
    color: "#000000"
    image_dark: assets/icon/splash_logo.png
    color_dark: "#000000"
