name: Backend CI

on:
  push:
    branches:
      - dev
      - main

  pull_request:
    branches:
      - dev
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hssan_delivery
          POSTGRES_USER: hssan
          POSTGRES_PASSWORD: hssan_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U hssan -d hssan_delivery"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Symfony's Dotenv::bootEnv() requires a ".env" file to exist on disk
      # (even when APP_ENV/DATABASE_URL are already set as real env vars),
      # both for the composer post-install "cache:clear" script and for
      # tests/bootstrap.php. ".env" itself is untracked (developer-local),
      # so CI needs its own copy; ".env.example" holds safe placeholder
      # values and is committed for exactly this purpose.
      - name: Create .env file
        run: cp .env.example .env

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql
          coverage: none

      - name: Validate composer.json and composer.lock
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate JWT test keys
        run: |
          mkdir -p config/jwt
          openssl genrsa -out config/jwt/private.pem 4096
          openssl rsa -in config/jwt/private.pem -pubout -out config/jwt/public.pem
          chmod 600 config/jwt/private.pem

      # NOTE: DATABASE_URL below points at the base "hssan_delivery" database,
      # not "..._test". config/packages/doctrine.yaml appends "_test" to the
      # dbname automatically for APP_ENV=test (dbname_suffix), the same way
      # it does for local development. Pointing this at "hssan_delivery_test"
      # directly would make Doctrine target a nonexistent "hssan_delivery_test_test".
      - name: Reset and migrate the test database
        env:
          APP_ENV: test
          JWT_PASSPHRASE: ci-test-passphrase
          DATABASE_URL: postgresql://hssan:hssan_test_password@127.0.0.1:5432/hssan_delivery?serverVersion=16&charset=utf8
        run: composer test-db-reset

      - name: Validate Doctrine schema
        env:
          APP_ENV: test
          JWT_PASSPHRASE: ci-test-passphrase
          DATABASE_URL: postgresql://hssan:hssan_test_password@127.0.0.1:5432/hssan_delivery?serverVersion=16&charset=utf8
        run: php bin/console doctrine:schema:validate --env=test

      - name: Run PHPUnit
        env:
          APP_ENV: test
          JWT_PASSPHRASE: ci-test-passphrase
          DATABASE_URL: postgresql://hssan:hssan_test_password@127.0.0.1:5432/hssan_delivery?serverVersion=16&charset=utf8
        run: php bin/phpunit

      # None of the steps above ever actually boot the production Docker
      # image (they run PHPUnit directly via the PHP CLI) — a bug that only
      # manifests when Apache itself starts (e.g. a module/MPM conflict in
      # the image) can build successfully and pass every test above, then
      # crash-loop the moment a real host actually runs it. Building and
      # booting the real image here, in prod mode, against this job's own
      # Postgres service, catches that whole class of bug before it ever
      # reaches a deploy.
      - name: Build the production Docker image
        run: docker build -t hssan-delivery-backend:smoke-test .

      - name: Smoke-test the Docker image actually boots
        env:
          # A fresh, never-migrated database — prod mode applies no
          # dbname_suffix (that's test-only, see doctrine.yaml), so this
          # points straight at the Postgres service's own default database.
          DATABASE_URL: postgresql://hssan:hssan_test_password@127.0.0.1:5432/hssan_delivery?serverVersion=16&charset=utf8
        run: |
          # Mirrors Railway: one persistent volume at var/storage, holding
          # uploaded photos and the JWT keypair (see docker/entrypoint.sh).
          app_secret="$(openssl rand -hex 32)"
          start_backend() {
            docker run -d --name backend-smoke --network host \
              -v smoke-storage:/var/www/html/var/storage \
              -e APP_ENV=prod \
              -e APP_SECRET="$app_secret" \
              -e JWT_PASSPHRASE=ci-test-passphrase \
              -e DATABASE_URL="$DATABASE_URL" \
              -e CORS_ALLOW_ORIGIN='^https://example\.com$' \
              -e JWT_COOKIE_SECURE=true \
              -e JWT_COOKIE_SAMESITE=none \
              -e SEED_FIXTURES=true \
              hssan-delivery-backend:smoke-test >/dev/null
          }

          # Not -f: security.yaml's access_control requires auth on every
          # /api/* route except login/register, so an unauthenticated hit
          # is expected to come back 401/404, not 2xx — that still proves
          # Apache/PHP/Symfony booted and is what this test is checking
          # for. A 5xx is a real application failure (e.g. a permissions
          # bug writing to var/cache/prod), not just "not authenticated",
          # so it's treated as a hard failure rather than retried away. A
          # connection failure (curl exit != 0, e.g. connection refused
          # because Apache never started) keeps retrying — the container
          # may just not be up yet.
          wait_for_backend() {
            status=""
            for _ in $(seq 1 20); do
              status=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1/ || true)
              if [ -n "$status" ] && [ "$status" != "000" ]; then
                return
              fi
              status=""
              sleep 2
            done
          }

          me_status() {
            curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1/api/auth/me \
              -H "Authorization: Bearer $1" || true
          }

          start_backend
          wait_for_backend

          # "/" maps straight to the real public/index.php, so it proves
          # nothing about how Apache routes and forwards everything else.
          # Two real Apache-level bugs got past the check above that way:
          # no FallbackResource (so /api/* never reached Symfony at all), and
          # Apache stripping "Authorization: Bearer" (so mobile logins
          # succeeded and every request after them 401'd). Log in as the
          # seeded client and make one Bearer-authenticated call, exactly as
          # the mobile app does.
          auth_ok=""
          token=""
          if [ -n "$status" ]; then
            token=$(curl -sS -X POST http://127.0.0.1/api/auth/login \
              -H 'Content-Type: application/json' \
              -d '{"phone":"22000001","password":"client1234"}' | jq -r '.token // empty' || true)
            if [ -n "$token" ]; then
              s=$(me_status "$token")
              echo "Bearer-authenticated GET /api/auth/me -> $s"
              [ "$s" = "200" ] && auth_ok="yes"
            else
              echo "Login as the seeded client returned no token."
            fi
          fi

          # Uploaded photos are served by Apache directly, outside Symfony, so
          # they need their own CORS header or the Flutter web client (which
          # fetches image bytes cross-origin) renders them blank. They're
          # also served through the public/uploads -> var/storage symlink, so
          # require an actual 200, not just the header.
          uploads_ok=""
          if [ -n "$status" ]; then
            docker exec backend-smoke sh -c 'echo probe > public/uploads/ci-probe.txt'
            headers=$(curl -sS -D - -o /dev/null http://127.0.0.1/uploads/ci-probe.txt \
              -H 'Origin: https://example.vercel.app' | tr -d '\r' || true)
            code=$(printf '%s\n' "$headers" | head -1)
            acao=$(printf '%s\n' "$headers" | grep -i '^access-control-allow-origin:' || true)
            echo "GET /uploads/ci-probe.txt -> $code / ${acao:-no Access-Control-Allow-Origin header}"
            case "$code" in *" 200"*) [ -n "$acao" ] && uploads_ok="yes" ;; esac
          fi

          echo "--- container logs (first boot) ---"
          docker logs backend-smoke
          docker rm -f backend-smoke >/dev/null

          # Simulate a redeploy: a brand-new container on the same volume.
          # A token issued before it must still be valid (the keypair must
          # not be regenerated), and the uploaded file must still be there.
          redeploy_ok=""
          if [ -n "$auth_ok" ]; then
            start_backend
            wait_for_backend
            s=$(me_status "$token")
            echo "After redeploy, old token GET /api/auth/me -> $s"
            f=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1/uploads/ci-probe.txt || true)
            echo "After redeploy, GET /uploads/ci-probe.txt -> $f"
            [ "$s" = "200" ] && [ "$f" = "200" ] && redeploy_ok="yes"
            echo "--- container logs (after redeploy) ---"
            docker logs backend-smoke
            docker rm -f backend-smoke >/dev/null
          fi

          if [ -z "$status" ]; then
            echo "Backend never responded — see logs above."
            exit 1
          fi
          case "$status" in
            5??)
              echo "Backend responded with $status (server error) — see logs above."
              exit 1
              ;;
            *)
              echo "Backend responded with $status."
              ;;
          esac
          if [ -z "$auth_ok" ]; then
            echo "Login + Bearer-authenticated request failed -- see logs above."
            exit 1
          fi
          if [ -z "$uploads_ok" ]; then
            echo "Uploaded files aren't served with 200 + a CORS header -- see above."
            exit 1
          fi
          if [ -z "$redeploy_ok" ]; then
            echo "Sessions or uploads didn't survive a redeploy on the same volume -- see above."
            exit 1
          fi
