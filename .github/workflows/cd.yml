name: CD

# Builds and publishes versioned Docker images for the backend and admin
# dashboard on every push to main (production). This is CI/CD's "CD" half:
# CI (backend.yml / admin.yml / mobile.yml) already gates every merge with
# lint + tests; this workflow assumes that gate passed and turns main's
# head into deployable artifacts.
#
# Then deploys them to the self-hosted server (deploy/, docs/DEPLOY.md):
# inert until three repo secrets exist — PROD_SSH_HOST, PROD_SSH_USER,
# PROD_SSH_KEY — matching the "inert until configured" pattern used
# elsewhere in this project (Sentry, Firebase): the build/push always runs,
# the deploy only once a server is there to receive it.
on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  backend:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: meta
        run: echo "image=ghcr.io/${OWNER,,}/hssan-delivery-backend" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  admin:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: meta
        run: echo "image=ghcr.io/${OWNER,,}/hssan-delivery-admin" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: admin
          push: true
          build-args: |
            VITE_API_URL=${{ vars.ADMIN_API_URL || '/' }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # The admin calls the API on its own domain ('/'): Caddy sends /api and
    # /uploads to the backend (deploy/Caddyfile), so the login cookie stays
    # first-party.
    needs: [backend, admin]
    runs-on: ubuntu-latest
    steps:
      - name: Check server secrets
        id: server
        run: |
          if [ -n "$PROD_SSH_HOST" ] && [ -n "$PROD_SSH_USER" ] && [ -n "$PROD_SSH_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}

      - name: Deploy to the server
        if: steps.server.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd /opt/hssan-delivery
            git pull --ff-only
            cd deploy
            docker compose -f docker-compose.prod.yml pull backend admin
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
