name: iOS TestFlight

# Builds the iPhone app on a GitHub-hosted Mac -- iOS apps can only be
# compiled with Xcode -- and, once the Apple secrets below exist, signs it
# and uploads it to App Store Connect, where it shows up in TestFlight.
#
# - Pull requests touching the app: an unsigned build only, to prove the iOS
#   project still compiles. Nothing is uploaded.
# - main (and manual runs): the same, plus signing and the TestFlight upload
#   when the secrets are set. Without them the job still does the unsigned
#   build and says what's missing, so it never fails just for that.
#
# Secrets (Settings -> Secrets and variables -> Actions), from an App Store
# Connect API key with the Admin role (Users and Access -> Integrations ->
# App Store Connect API) -- Xcode uses it to create the signing
# certificate and provisioning profile itself, so none are stored here:
#   APP_STORE_CONNECT_KEY_ID      the key's ID
#   APP_STORE_CONNECT_ISSUER_ID   the issuer ID shown above the keys list
#   APP_STORE_CONNECT_API_KEY     the contents of the downloaded AuthKey_*.p8
#   APPLE_TEAM_ID                 Membership details -> Team ID
#
# Optional variables, for push notifications on iPhone -- from the iOS app
# registered in the Firebase console (bundle ID tn.hssan.delivery), whose
# GoogleService-Info.plist lists them: FIREBASE_IOS_APP_ID (GOOGLE_APP_ID)
# and FIREBASE_IOS_API_KEY (API_KEY). Firebase also needs the APNs key
# uploaded (Project settings -> Cloud Messaging). Without the variables the
# app runs with notifications off.
#
# macOS runner minutes count ten times against the GitHub Actions quota on
# private repositories (~15 min per build), hence no run on every dev push.

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/ios-testflight.yml'
  pull_request:
    paths:
      - 'mobile/ios/**'
      - 'mobile/pubspec.yaml'
      - 'mobile/pubspec.lock'
      - '.github/workflows/ios-testflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60

    defaults:
      run:
        working-directory: mobile

    env:
      # The API the app talks to, baked into the build: the repo variable
      # API_BASE_URL (Settings > Secrets and variables > Actions >
      # Variables), e.g. https://api.your-domain.tn. Railway until it's set.
      API_BASE_URL: ${{ vars.API_BASE_URL || 'https://hssan-delivery-production.up.railway.app' }}
      # Public client identifiers, like android-release.yml's, but for the
      # iOS app registered in Firebase -- push stays off until they're set.
      FIREBASE_API_KEY: ${{ vars.FIREBASE_IOS_API_KEY }}
      FIREBASE_APP_ID: ${{ vars.FIREBASE_IOS_APP_ID }}
      FIREBASE_MESSAGING_SENDER_ID: '162751503293'
      FIREBASE_PROJECT_ID: hssan-delivery
      # Signing only for main/manual runs, and only once the key exists.
      SIGN: ${{ github.event_name != 'pull_request' && secrets.APP_STORE_CONNECT_API_KEY != '' && secrets.APPLE_TEAM_ID != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Unsigned build (compile check)
        if: env.SIGN != 'true'
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --build-number="${{ github.run_number }}"

      - name: Explain why nothing was uploaded
        if: env.SIGN != 'true' && github.event_name != 'pull_request'
        run: |
          echo "::notice::iOS app compiled, but not uploaded to TestFlight: add the APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_API_KEY and APPLE_TEAM_ID secrets (see the top of ios-testflight.yml)."

      - name: Install the App Store Connect API key
        if: env.SIGN == 'true'
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Configure the Flutter build
        if: env.SIGN == 'true'
        run: |
          # Writes the dart-defines and build number into the Xcode config;
          # the archive step below compiles the Dart code with them.
          flutter build ios --release --config-only \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --build-number="${{ github.run_number }}"

      - name: Archive (signed)
        if: env.SIGN == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic

      - name: Upload to TestFlight
        if: env.SIGN == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # destination=upload: exporting sends the build straight to App
          # Store Connect; it appears in TestFlight once Apple processes it.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "::notice::Build ${{ github.run_number }} uploaded to App Store Connect; it shows up in TestFlight once Apple has processed it (usually 5-15 minutes)."
