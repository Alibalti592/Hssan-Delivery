name: Android release APK

# Builds a sideloadable release APK against the production API and publishes
# it as the "android-latest" pre-release, so there's always one direct .apk
# link to open on a phone. With the ANDROID_UPLOAD_* secrets set (see "Install
# the upload key" below), it's signed with the app's permanent upload key, so
# each build installs over the last, and a Google Play bundle (.aab) is built
# too, kept as this run's "hssan-delivery-aab" artifact. Without them it's
# signed with the runner's throwaway debug key, which changes every run:
# uninstall the previous build before installing a new one.

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'API the build talks to (empty: the default below)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    env:
      # The API the app talks to, baked into the build: a manual run's
      # api_base_url input, else the repo variable API_BASE_URL (Settings >
      # Secrets and variables > Actions > Variables), else the app's own domain.
      API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL || 'https://api.deliveryhassan.tn' }}
      # Firebase (push notifications) -- public client identifiers from
      # android/app/google-services.json, not secrets. The server-side
      # key that actually sends pushes is the backend's FIREBASE_CREDENTIALS.
      FIREBASE_API_KEY: AIzaSyAfv2nSn8mXKvMEaQOwpVO9kpKZUg-tjwA
      FIREBASE_APP_ID: '1:162751503293:android:c2c85ceafccffb5a88d0d4'
      FIREBASE_MESSAGING_SENDER_ID: '162751503293'
      FIREBASE_PROJECT_ID: hssan-delivery

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: a new Flutter release can require newer build tools than
          # the project has (3.50 wants Gradle 9.3.1; android/ is on 8.14.3)
          # and break every build overnight. Upgrade on purpose, here and in
          # the other mobile workflows together.
          flutter-version: 3.47.9
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The permanent upload key for Google Play, from four repo secrets
      # (Settings > Secrets and variables > Actions): ANDROID_UPLOAD_KEYSTORE
      # (the .jks file, base64), ANDROID_UPLOAD_STORE_PASSWORD,
      # ANDROID_UPLOAD_KEY_ALIAS, ANDROID_UPLOAD_KEY_PASSWORD. Without them
      # the build is signed with this runner's throwaway debug key, as before.
      - name: Install the upload key
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "No upload key secrets: signing with the debug key."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=${KEY_PASSWORD:-$STORE_PASSWORD}"
          } > android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --build-number="${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-release.apk hssan-delivery.apk
          ls -l hssan-delivery.apk

      # What Google Play takes: an app bundle, signed with the upload key.
      # Only then; a debug-signed one would be refused anyway.
      - name: Build the Google Play bundle
        if: steps.signing.outputs.signed == 'true'
        run: |
          flutter build appbundle --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --build-number="${{ github.run_number }}"
          cp build/app/outputs/bundle/release/app-release.aab hssan-delivery.aab
          ls -l hssan-delivery.aab

      - name: Upload the Google Play bundle
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: hssan-delivery-aab
          path: mobile/hssan-delivery.aab

      - name: Forget the upload key
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: hssan-delivery-apk
          path: mobile/hssan-delivery.apk

      - name: Publish the android-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            key_note="Signed with the app's upload key: installs over the previous build."
          else
            key_note="Test build signed with a throwaway key: uninstall any previous Hssan Delivery build before installing this one."
          fi
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest hssan-delivery.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Android test build (${GITHUB_REF_NAME} #${{ github.run_number }})" \
            --notes "Release APK built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}, pointing at ${API_BASE_URL}. ${key_note}"
