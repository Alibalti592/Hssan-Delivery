version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      symfony:
        patterns:
          - "symfony/*"

  - package-ecosystem: "npm"
    directory: "/admin"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pub"
    directory: "/mobile"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/admin"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
