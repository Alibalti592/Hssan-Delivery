# Production on a self-hosted server: the API, the admin dashboard,
# Postgres, Caddy (HTTPS from Let's Encrypt) and a nightly backup. Run from
# this directory, next to a filled-in .env (copy .env.example):
#
#   docker compose -f docker-compose.prod.yml up -d
#
# Only Caddy is reachable from the internet (80/443). Postgres and the
# backend sit on the compose network only. Step by step: docs/DEPLOY.md.
name: hssan-delivery

services:
  postgres:
    # The same major version as Railway's database (18), so its dump
    # restores here as is.
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: hssan_delivery
      POSTGRES_USER: hssan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # Postgres 18's image keeps its data under /var/lib/postgresql/18/.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hssan -d hssan_delivery"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: ghcr.io/${IMAGE_OWNER:-alibalti592}/hssan-delivery-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
      DATABASE_URL: postgresql://hssan:${POSTGRES_PASSWORD}@postgres:5432/hssan_delivery?serverVersion=16&charset=utf8
      DEFAULT_URI: https://${API_DOMAIN}
      # The admin is served from its own domain, same origin as the API
      # behind Caddy (see Caddyfile), so this only matters for a browser on
      # another site — which should be refused.
      CORS_ALLOW_ORIGIN: ^https://${ADMIN_DOMAIN}$$
      JWT_SECRET_KEY: '%kernel.project_dir%/config/jwt/private.pem'
      JWT_PUBLIC_KEY: '%kernel.project_dir%/config/jwt/public.pem'
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:?set JWT_PASSPHRASE in .env}
      JWT_COOKIE_SECURE: "true"
      JWT_COOKIE_SAMESITE: lax
      LOCK_DSN: flock
      # Caddy reaches the backend from the compose network: trust what it
      # forwards (the client's address, https), and nothing from outside.
      TRUSTED_PROXIES: 127.0.0.1,PRIVATE_SUBNETS
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Path of the Firebase service-account file, under ./secrets.
      FIREBASE_CREDENTIALS: ${FIREBASE_CREDENTIALS:-}
      SEED_FIXTURES: ${SEED_FIXTURES:-false}
    volumes:
      # Photos (menus, bills) and the JWT keypair, as on Railway.
      - backend_storage:/var/www/html/var/storage
      - ./secrets:/run/secrets:ro

  admin:
    image: ghcr.io/${IMAGE_OWNER:-alibalti592}/hssan-delivery-admin:${IMAGE_TAG:-latest}
    restart: unless-stopped

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - backend
      - admin
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?set ADMIN_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backup:
    # pg_dump must be as new as the server.
    image: postgres:18
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${TZ:-Africa/Tunis}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
      - backend_storage:/storage:ro

volumes:
  postgres_data:
  backend_storage:
  caddy_data:
  caddy_config:
